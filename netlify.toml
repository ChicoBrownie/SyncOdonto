[build]
  # O ESLint continua obrigatório no desenvolvimento, mas apresentou falha de
  # inicialização específica na imagem Linux do Netlify. O deploy permanece
  # protegido por tipos, testes e pela compilação de produção do Next.js.
  command = "npm run typecheck && npm test && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
